server:
  host: 127.0.0.1
  port: 8765
  auto_open_browser: true
  log_level: INFO
data_source:
  exchange: binance
  api_base: https://api.binance.com
  timeout: 5
  retries: 1
  proxy:
    enabled: false
    http: ''
    https: ''
backtest:
  initial_capital: 10000.0
  commission_rate: 0.0004
  slippage: 0.0005
  position_mode: all_in
  fixed_amount: 1000.0
  leverage: 1
  rebalance_bars: 1
  default_timeframe: 4h
  start_date: '20240101'
  end_date: auto
# timeframes 字段从 Binance 白名单自动派生 (后端 /api/data/timeframes)
# 不再硬编码, 如需调整显示顺序可在这里覆盖
# timeframes: []
ui:
  theme: dark
  show_help_tooltips: true
  default_page: dashboard
trading:
  enabled: false
  mode: simulation
  max_position_pct: 0.3
  max_total_pct: 0.95
  stop_loss_pct: 0.05
  take_profit_pct: 0.15
active_symbols:
- ADAUSDT
- AVAXUSDT
- BNBUSDT
- BTCUSDT
- DOGEUSDT
- ETHUSDT
- SOLUSDT
- XRPUSDT
